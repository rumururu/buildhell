      C 284 230, 324 300, 334 390
      C 374 300, 464 250, 512 140 Z"/>
    <!-- 안쪽 불꽃 -->
    <path fill="url(#flameInner)" d="
      M512 330
      C 545 410, 620 450, 630 540
      C 638 620, 585 680, 512 680
      C 439 680, 386 620, 394 540
