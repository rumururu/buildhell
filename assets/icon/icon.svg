    <!-- 가마솥 -->
    <path fill="url(#pot)" d="M196 610 H828 C 828 760, 700 860, 512 860 C 324 860, 196 760, 196 610 Z"/>
    <rect x="160" y="585" width="704" height="56" rx="28" fill="#4E342E"/>
    <rect x="160" y="585" width="704" height="16" rx="8" fill="#8D6E63" opacity="0.6"/>
    <!-- 솥 다리 -->
    <rect x="300" y="830" width="44" height="70" rx="12" fill="#120807"/>
    <rect x="680" y="830" width="44" height="70" rx="12" fill="#120807"/>
    <!-- 솥에 새긴 눈 (악마) -->
