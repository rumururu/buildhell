    <linearGradient id="pot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3E2723"/>
      <stop offset="1" stop-color="#120807"/>
    </linearGradient>
  </defs>
  <g id="fg">
    <!-- 바깥 불꽃 (위쪽에 뿔 두 개) -->
    <path fill="url(#flameOuter)" d="
